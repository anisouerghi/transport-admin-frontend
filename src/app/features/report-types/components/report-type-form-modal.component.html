<c-modal alignment="center" [visible]="visible" (visibleChange)="onVisibleChange($event)">
  <c-modal-header>
    <h5 cModalTitle>{{ isEdit ? 'Edit report type' : 'Add report type' }}</h5>
    <button cButtonClose (click)="close()"></button>
  </c-modal-header>
  <c-modal-body>
    <form cForm [formGroup]="form" (ngSubmit)="submit()" [validated]="submitted()" id="reportTypeForm">
      <c-row class="g-3">
        <c-col md="6">
          <label cLabel for="code">Code</label>
          <input cFormControl id="code" formControlName="code" [valid]="fieldTouchedValid('code')" />
          @if (fieldInvalid('code')) {
            <div class="invalid-feedback d-block">Code is required (max 50).</div>
          }
        </c-col>
        <c-col md="6">
          <label cLabel for="label">Label FR</label>
          <input cFormControl id="label" formControlName="label" [valid]="fieldTouchedValid('label')" />
          @if (fieldInvalid('label')) {
            <div class="invalid-feedback d-block">French label is required (max 150).</div>
          }
        </c-col>
        <c-col md="6">
          <label cLabel for="labelAr">Label AR</label>
          <input cFormControl id="labelAr" formControlName="labelAr" dir="rtl" />
        </c-col>
        <c-col md="6">
          <label cLabel for="labelEn">Label EN</label>
          <input cFormControl id="labelEn" formControlName="labelEn" />
        </c-col>
        <c-col cols="12">
          <label cLabel for="description">Description</label>
          <textarea
            cFormControl
            id="description"
            formControlName="description"
            rows="3"
            [valid]="fieldTouchedValid('description')"
          ></textarea>
          @if (fieldInvalid('description')) {
            <div class="invalid-feedback d-block">Description max 500 characters.</div>
          }
        </c-col>
      </c-row>
    </form>
  </c-modal-body>
  <c-modal-footer>
    <button cButton color="secondary" variant="outline" type="button" (click)="close()">Cancel</button>
    <button cButton color="primary" type="submit" form="reportTypeForm" [disabled]="saving()">
      {{ saving() ? 'Saving…' : 'Save' }}
    </button>
  </c-modal-footer>
</c-modal>
